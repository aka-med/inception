services:
  nginx:
    build:
      context: ./requirements/nginx/
      args:
        DOMAIN_NAME: ${DOMAIN_NAME}
    image: nginx:inception
    restart: always
    ports:
      - "443:443"
    networks:
      - inception_net
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html:ro

  wordpress:
    build: ./requirements/wordpress/
    image: wordpress:inception
    restart: always
    networks:
      - inception_net
    depends_on:
      - mariadb
      - redis
    volumes:
      - wp_data:/var/www/html
    environment:
      WORDPRESS_DB_HOST:          ${WORDPRESS_DB_HOST}
      WORDPRESS_DB_NAME:          ${MARIADB_DATABASE}
      WORDPRESS_DB_USER:          ${MARIADB_USER}

      WORDPRESS_DB_PASSWORD_FILE: ${MARIADB_PASSWORD_FILE}
      WP_ADMIN_PASSWORD_FILE:     ${WP_ADMIN_PASSWORD_FILE}
      WP_USER_PASSWORD_FILE:      ${WP_USER_PASSWORD_FILE}

      WP_SITE_URL:                ${WP_SITE_URL}
      WP_SITE_TITLE:              ${WP_SITE_TITLE}
      WP_ADMIN_USER:              ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL:             ${WP_ADMIN_EMAIL}
      WP_USER:                    ${WP_USER}
      WP_USER_EMAIL:              ${WP_USER_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
  
  mariadb:
    build: ./requirements/mariadb/
    image: mariadb:inception
    restart: always
    environment:
      MARIADB_DATABASE:           ${MARIADB_DATABASE}
      MARIADB_USER:               ${MARIADB_USER}
      MARIADB_PASSWORD_FILE:      ${MARIADB_PASSWORD_FILE}
      MARIADB_ROOT_PASSWORD_FILE: ${MARIADB_ROOT_PASSWORD_FILE}
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception_net
    volumes:
      - db_data:/var/lib/mysql
  redis:
    build: ./requirements/bonus/redis/
    image: redis:inception
    restart: always
    networks:
      - inception_net
  adminer:
    build: ./requirements/bonus/adminer
    image: adminer:inception
    restart: always
    networks:
      - inception_net
  ftp:
    build: ./requirements/bonus/ftp
    image: ftp:inception
    restart: always
    networks:
      - inception_net
    depends_on:
      - wordpress
    volumes:
      - wp_data:/var/www/html
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      FTP_USER: "${FTP_USER}"
      FTP_PASS_FILE: ${FTP_PASS_FILE}
    secrets:
      - ftp_password
  cadvisor:
    container_name: cadvisor
    build: ./requirements/bonus/cadvisor
    image: cadvisor:inception
    restart: always
    networks:
      - inception_net
    ports:
      - "8000:8080"
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /var/run:/var/run:ro
  static:
    build: ./requirements/bonus/static
    image: static:inception
    restart: always
    ports:
      - "3031:80"
    networks:
      - inception_net
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
networks:
  inception_net:
volumes:
  db_data:
    driver: local
    driver_opts:
      type: none
      device: /home/${LOGIN}/data/db_data
      o: bind
  wp_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/${LOGIN}/data/wp_data
