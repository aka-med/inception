events {}

http {
  include       mime.types;
  default_type  application/octet-stream;

  server {
    listen 443 ssl;
    server_name makarkao.42.fr;

    ssl_certificate     /etc/nginx/ssl/inception.crt;
    ssl_certificate_key /etc/nginx/ssl/inception.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    root  /var/www/html;
    index index.php index.html;

    location / {
      try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
      try_files $uri =404;

      include fastcgi_params;
      fastcgi_pass wordpress:9000;

      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location = /adminer {
    return 301 /adminer/;
    }

    location ^~ /adminer/ {
        include fastcgi_params;
        # Always execute the single adminer.php script inside the adminer container
        fastcgi_param SCRIPT_FILENAME /var/www/adminer/adminer.php;
        # Optional but helps Adminer generate correct links under /adminer/
        fastcgi_param SCRIPT_NAME /adminer/adminer.php;
        fastcgi_pass adminer:9000;
    }

  }
}
